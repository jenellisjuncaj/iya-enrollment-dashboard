name: Refresh enrollment data

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pacific time
        id: pacific-time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=America/Los_Angeles date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        if: steps.pacific-time.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        if: steps.pacific-time.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh SOC data
        if: steps.pacific-time.outputs.run == 'true'
        run: node scripts/refresh-data.js

      - name: Commit changed data
        if: steps.pacific-time.outputs.run == 'true'
        run: |
          git add data.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh enrollment data"
          git push origin HEAD:main
